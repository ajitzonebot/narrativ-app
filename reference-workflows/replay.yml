name: replay

# History replay of the code rules (narrativ/replay.py): each month end since Mar 2024, rebuild what the pipeline knew that
# day, pick the Top 10, and measure 3/6/12-month returns vs the Nifty, with each gate and ranking input switched off in turn.
on:
  workflow_dispatch:
    inputs:
      quick: { description: "Quick test (300 stocks, 3 months)", default: "false" }
  schedule:
    - cron: "15 7 1 * *"   # 12:45 IST on the 1st of each month: one more month of history

permissions:
  contents: write

concurrency:
  group: replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4   # read-only: daily.yml owns the sources cache
        with:
          path: data/source_cache
          key: sources-daily-${{ github.run_id }}
          restore-keys: |
            sources-daily-
            sources-
      - name: Replay
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m narrativ.replay ${{ inputs.quick == 'true' && '--quick' || '' }}
      - name: Commit
        if: inputs.quick != 'true'
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/replay.json data/replay
          git diff --cached --quiet && exit 0
          git commit -m "data: replay $(TZ=Asia/Kolkata date +%F)"
          bash scripts/push_retry.sh
