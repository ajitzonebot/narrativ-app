name: tests

# Lint (ruff: undefined names, unused imports) and unit tests (pytest; HTTP replayed from tests/cassettes with vcrpy, no network).
on:
  push:
    paths: ["**.py", "tests/**", "requirements*.txt", ".github/workflows/tests.yml", "ruff.toml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
