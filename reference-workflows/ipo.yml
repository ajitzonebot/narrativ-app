name: ipo
# Open-IPO check without Claude (narrativ/ipo.py): 08:30 and 15:30 IST Mon-Fri, started by the Cloudflare Worker crons
# (exact time); the GitHub schedule below is a late backup. The 15:30 run makes the final-day call.
on:
  schedule:
    - cron: "15 3 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipo
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: IPO check
        run: |
          pip install -q -r requirements.txt
          python -m narrativ.ipo
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ipo_today.json docs/data/ipo_history.json
          git diff --cached --quiet && exit 0
          git commit -m "ipo: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') check"
          bash scripts/push_retry.sh -X theirs
