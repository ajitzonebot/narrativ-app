name: gh-token-check

# Can the Worker's GitHub token (NARRATIV_GH_TOKEN) start workflows? Starts the read-only d1-check as a harmless test.
on: workflow_dispatch

# No repo token needed: only the Cloudflare / Worker secrets are used.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch d1-check with the Worker token
        env:
          T: ${{ secrets.NARRATIV_GH_TOKEN }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/d1-check.yml/dispatches" -d '{"ref":"main"}')
          echo "dispatch http=$code (204 = token can start workflows; 403 = add Actions: Read and write)"
          cat out.json 2>/dev/null | head -c 300; echo
          for path in "" "/actions/workflows" "/issues?per_page=1"; do
            c=$(curl -s -o o2.json -w "%{http_code}" -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}$path")
            echo "GET repo$path http=$c"
          done
          c=$(curl -s -o o3.json -w "%{http_code}" -H "Authorization: Bearer $T" "https://api.github.com/repos/ajitzonebot/narrativ-app")
          echo "GET narrativ-app http=$c push=$(jq -r '.permissions.push // "n/a"' o3.json)"
          curl -s -I -H "Authorization: Bearer $T" "https://api.github.com/repos/${{ github.repository }}" | grep -i "x-accepted-github-permissions\|github-authentication-token-expiration" || true
