name: gh-token-check

# Read-only check of the Worker's GitHub token (secret NARRATIV_WORKER_TOKEN; worker.yml gives it to the Worker as GH_TOKEN).
# It needs exactly what worker/worker.js calls: read docs/ of the private repo (/data), list and create issues there
# (feedback, scan), start workflows in this public repo (cron dispatch of daily.yml / ipo.yml). It must NOT be able to push.
# Starts the read-only d1-check here as the dispatch test. Prints only HTTP codes and true/false.
on: workflow_dispatch

# No repo token needed: only the Worker token is used.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Worker token permissions
        shell: bash   # visible: prints HTTP codes only
        env:
          T: ${{ secrets.NARRATIV_WORKER_TOKEN }}
          DATA_REPO: ${{ github.repository }}
        run: |
          [ -n "$T" ] || { echo "NARRATIV_WORKER_TOKEN is not set"; exit 1; }
          H=(-H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json")
          code() { curl -s -o /dev/null -w "%{http_code}" "${H[@]}" "$@"; }
          read_data=$(code "https://api.github.com/repos/$DATA_REPO/contents/docs/data/picks.json")
          list_issues=$(code "https://api.github.com/repos/$DATA_REPO/issues?per_page=1")
          dispatch=$(code -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/d1-check.yml/dispatches" -d '{"ref":"main"}')
          # write probe that cannot succeed (no such commit): 403 = no Contents write (good), 422 = the token could push
          push=$(code -X POST "https://api.github.com/repos/$DATA_REPO/git/refs" -d '{"ref":"refs/heads/token-check","sha":"0000000000000000000000000000000000000000"}')
          echo "read private docs/: http=$read_data (want 200)"
          echo "list private issues: http=$list_issues (want 200; creating needs Issues: Read and write)"
          echo "dispatch d1-check here: http=$dispatch (want 204; 403 = add Actions: Read and write)"
          echo "write probe on the private repo: http=$push (want 403)"
          [ "$read_data" = 200 ] && [ "$list_issues" = 200 ] && [ "$dispatch" = 204 ] && [ "$push" = 403 ]
