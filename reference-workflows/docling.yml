name: docling

# Layout-aware reading (narrativ/docread.py): OCR for scanned PDFs, tables kept for presentations of stocks in Claude's
# queue. Runs after the daily run, in parallel with the readers; results feed tomorrow's packs, readers and verifier.
on:
  workflow_run:
    workflows: ["daily-funnel"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max_docs: { description: "Documents this run", default: "40" }

permissions:
  contents: write

concurrency:
  group: docling
  cancel-in-progress: false

jobs:
  convert:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "docling>=2.0"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docling-models-v2
      - name: Convert
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m narrativ.docread "${{ inputs.max_docs || '40' }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/docling
          git diff --cached --quiet && exit 0
          git commit -m "data: docling $(TZ=Asia/Kolkata date +%F)"
          bash scripts/push_retry.sh
