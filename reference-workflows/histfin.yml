# Benchmark history backfill (narrativ/histfin.py): NSE quarterly results filed before the daily store's 16 quarters,
# read with the declared-period fallback. Research only; nothing the app reads changes. Resumable: each run does up to
# 100 minutes in five 20-minute chunks, saving after each; the schedule repeats every 2 hours and does nothing once every stock is done.
name: histfin

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: histfin
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Data files from the data branch (stage 3+; does nothing before)
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m narrativ.databranch checkout --force
      - name: Anything left?
        id: left
        run: |
          n=$(python3 -c "import json,pathlib as P;s=json.loads(P.Path('data/benchmark/histfin_symbols.json').read_text())['symbols'];f=lambda x:P.Path('data/financials_hist/'+x+'.json');print(sum(1 for x in s if not f(x).exists() or json.loads(f(x).read_text()).get('done')!=1))")
          echo "n=$n" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.left.outputs.n != '0'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.left.outputs.n != '0'
        run: pip install -r requirements.txt
      # saves after every 20-minute chunk (owner, 27 Nov 2026: "save at every step so a failure doesn't stop everything"):
      # each stock's file is written as soon as it is read, and a failed chunk or push only loses that chunk
      - name: Backfill and save every 20 minutes
        if: steps.left.outputs.n != '0'
        env:
          PYTHONUNBUFFERED: "1"
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            python -m narrativ.histfin --minutes 20 || echo "chunk $i: histfin stopped with an error; saving what it read"
            bash scripts/publish.sh -m "data: history backfill $(TZ=Asia/Kolkata date '+%F %H:%M') IST" -- data/financials_hist || echo "chunk $i: save failed; the next chunk retries"
            left=$(python3 -c "import json,pathlib as P;s=json.loads(P.Path('data/benchmark/histfin_symbols.json').read_text())['symbols'];f=lambda x:P.Path('data/financials_hist/'+x+'.json');print(sum(1 for x in s if not f(x).exists() or json.loads(f(x).read_text()).get('done')!=1))")
            echo "chunk $i: $left stocks left"
            [ "$left" = "0" ] && break
          done
      - name: Save on failure
        if: failure() && steps.left.outputs.n != '0'
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish.sh -m "data: history backfill (saved after a failure) $(TZ=Asia/Kolkata date '+%F %H:%M') IST" -- data/financials_hist
