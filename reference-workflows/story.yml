name: story
# Narrativ sheets: free models write each stock's 'What they do' and 'How they make money' (narrativ/story.py --write),
# in priority order, resuming where the last run stopped. Mornings IST, when the free tier is least busy; the daily run
# puts the sheets on the dossiers.
on:
  schedule:
    - cron: "0 1 * * *"     # 06:30 IST
    - cron: "30 4 * * *"    # 10:00 IST
  # The Worker also starts it at 06:30 and 09:30 IST (worker.js STORY_CRON): GitHub skipped both runs on 26 Nov 2026.
  workflow_dispatch:
    inputs:
      mode:
        description: "write (the sheets) or compare (side-by-side model test, data/story_compare.json)"
        type: string
        default: write
      n:
        description: "compare only: how many stocks (try 3 first)"
        type: string
        default: "30"
permissions:
  contents: write
concurrency:
  group: story
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Data files from the data branch (stage 3+; does nothing before)
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m narrativ.databranch checkout --force
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Write
        timeout-minutes: 38
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_COMPARE_N: ${{ inputs.n }}
          # inputs reach the shell only as env values, checked against a list (Cloudflare audit 26 Nov 2026)
          STORY_MODE: ${{ inputs.mode || 'write' }}
        run: |
          case "$STORY_MODE" in write|compare) ;; *) echo "unknown mode: $STORY_MODE"; exit 1 ;; esac
          case "$STORY_COMPARE_N" in ''|*[!0-9]*) [ -z "$STORY_COMPARE_N" ] || { echo "n must be a number"; exit 1; } ;; esac
          pip install -q -r requirements.txt
          python -m narrativ.story "--$STORY_MODE"
      - name: Commit
        if: always()
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish.sh -m "story: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') sheets" --mine all -- data/story.json data/story_compare.json
