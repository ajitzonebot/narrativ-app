name: story
# Narrativ sheets: free models write each stock's 'What they do' and 'How they make money' (narrativ/story.py --write),
# in priority order, resuming where the last run stopped. Mornings IST, when the free tier is least busy; the daily run
# puts the sheets on the dossiers.
on:
  schedule:
    - cron: "0 1 * * *"     # 06:30 IST
    - cron: "30 4 * * *"    # 10:00 IST
  # The Worker also starts it at 06:30 and 09:30 IST (worker.js STORY_CRON): GitHub skipped both runs on 26 Nov 2026.
  workflow_dispatch:
    inputs:
      mode:
        description: "write (the sheets) or compare (side-by-side model test, data/story_compare.json)"
        type: string
        default: write
permissions:
  contents: write
concurrency:
  group: story
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Write
        timeout-minutes: 38
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          python -m narrativ.story --${{ inputs.mode || 'write' }}
      - name: Commit
        if: always()
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/story.json $(ls data/story_compare.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "story: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') sheets"
          bash scripts/push_retry.sh -X theirs
