name: probe-nsedaily
# Prints NSE daily-file samples (delivery %, index lists, GSM/ASM). Commits nothing.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m scripts.probe_nsedaily
        env: { PYTHONUNBUFFERED: "1" }
