name: cf-secrets-check

# Read-only: lists the Worker's secret NAMES (never values) and shows the API's answer, to diagnose secret uploads.
on: workflow_dispatch

# No repo token needed: only the Cloudflare / Worker secrets are used.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACC=$(printf %s "$ACC" | tr -d "[:space:]\"'")
          for path in "workers/scripts/narrativ/secrets" "workers/scripts/narrativ/schedules" "workers/scripts/narrativ/versions" "workers/scripts/narrativ/deployments" "workers/subdomain"; do
            code=$(curl -s -o out.json -w "%{http_code}" -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/$path")
            echo "$path http=$code $(jq -c '{success, errors}' out.json 2>/dev/null | tr -d '\n' || head -c 200 out.json)"
          done
