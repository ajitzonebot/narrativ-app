name: measure-docs

on:
  workflow_dispatch:
    inputs:
      days: { description: "Days back", default: "30" }
      sample: { description: "PDFs to check for a text layer", default: "80" }

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Measure document funnel
        env: { PYTHONUNBUFFERED: "1" }
        run: python -m scripts.measure_docs "${{ inputs.days }}" "${{ inputs.sample }}"
      - uses: actions/upload-artifact@v4
        with: { name: doc-funnel, path: probe/doc_funnel_30d.json }
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/doc_funnel_30d.json
          git diff --cached --quiet && exit 0
          git commit -m "probe: document funnel measurement $(date -u +%F)"
          bash scripts/push_retry.sh
