name: sim

# One-off rule simulations on today's published data (no downloads, no rule changes). Owner-approved studies only.
on:
  workflow_dispatch:
    inputs:
      module: { description: "Simulation module (narrativ.<name>)", default: "sim_notrated" }

permissions:
  contents: write

concurrency:
  group: sim
  cancel-in-progress: false

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Data files from the data branch (stage 3+; does nothing before)
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m narrativ.databranch checkout --force
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Simulate
        timeout-minutes: 38  # step limit, so the Commit step below still runs and saves partial results
        env:
          PYTHONUNBUFFERED: "1"
          MOD: ${{ inputs.module }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [[ "$MOD" =~ ^sim_[a-z0-9_]+$ ]] || { echo "module must be sim_<name>"; exit 1; }
          python -m "narrativ.$MOD"
      - name: Commit
        if: always()  # a probe that times out still saves what it wrote
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # push_retry.sh: changed docs/data files to R2 after the push
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOD: ${{ inputs.module }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish.sh -m "data: sim $MOD $(TZ=Asia/Kolkata date +%F)" -- docs/data/sim_*.json docs/research/sim_*.md
