name: probe-universe

# Dry run of the exchange-sourced sweep: prints counts and joins, commits nothing.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Sweep dry run
        env: { PYTHONUNBUFFERED: "1" }
        run: |
          python - <<'PY'
          import json
          from narrativ import sweep, universe as U
          df, st = sweep.sweep()
          print("STATS", json.dumps(st["universe"]))
          print("cols", sorted(df.columns)[:40])
          print("no price", int(df["regularMarketPrice"].isna().sum()), "no industry", int(df["industry"].isna().sum()), "no sector", int(df["sector"].isna().sum()))
          print("tags", df["tags"].explode().value_counts().head(12).to_dict())
          codes = json.load(open("data/bse_codes.json"))
          print("aliases", U.aliases(df[["symbol", "bse_code"]].to_dict("records"), codes))
          for s in ["RELIANCE.NS", "TCS.NS", "BONDADA.NS", "NSE.BO", "SIMMOND.BO"]:
              r = df[df.symbol == s]
              print(s, r[["symbol", "isin", "bse_code", "longName", "industry", "sector", "regularMarketPrice", "marketCap"]].to_dict("records"))
          PY
