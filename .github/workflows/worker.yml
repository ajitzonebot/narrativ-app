# Hand-written for the public repo (not generated). Source: the private repo's .github/workflow-src/worker.yml.
name: worker-deploy

# Deploys the Cloudflare Worker from the private repo's worker/ folder. Run by hand after a Worker change.
#
# The Worker's GitHub token (Worker secret GH_TOKEN) comes from NARRATIV_WORKER_TOKEN, NOT from NARRATIV_RW_TOKEN: a
# Worker is reachable from the internet, so it holds only what worker/worker.js calls:
#   private ajitzonebot/Narrativ: Contents read (GET /contents/docs/... for /data), Issues read and write (feedback, scan)
#   public ajitzonebot/narrativ-app: Actions read and write (cron dispatch of daily.yml / ipo.yml)
# Check it with the gh-token-check workflow. NARRATIV_RW_TOKEN is used only by the failure-log step (push logs/).
# CLOUDFLARE_API_TOKEN deploys the Worker with its R2 binding (wrangler.toml [[r2_buckets]] DATA_R2 -> narrativ-data): it needs
# Account > Workers Scripts > Edit and Account > Workers R2 Storage > Edit (the pipeline's R2 uploads already use the latter).
# Deploy after a daily run has uploaded the app files (R2 app/_manifest.json exists); until then /data reads GitHub as before.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - name: Check secrets
        shell: bash   # visible on purpose: prints only which secrets are missing
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WT: ${{ secrets.NARRATIV_WORKER_TOKEN }}
          KEY: ${{ secrets.NARRATIV_APP_KEY }}
        run: |
          ok=1
          [ -n "$CF" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; ok=0; }
          # No fallback to NARRATIV_RW_TOKEN: the Worker must never hold the private repo's write token.
          [ -n "$WT" ] || { echo "::error::NARRATIV_WORKER_TOKEN is not set. Create it (see public-workflows/README.md in the private repo: fine-grained token, Narrativ Contents read + Issues read/write, narrativ-app Actions read/write) and add it as an Actions secret here."; ok=0; }
          # No default key: a published fallback would let anyone call the API. Fail instead of deploying with it.
          [ -n "$KEY" ] || { echo "::error::NARRATIV_APP_KEY is not set"; ok=0; }
          [ "$ok" = 1 ]
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_WORKER_TOKEN }}   # Contents read is enough to deploy
          persist-credentials: false
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.NARRATIV_WORKER_TOKEN }}
          APP_KEY: ${{ secrets.NARRATIV_APP_KEY }}
        run: |
          npx -y wrangler@4.20.0 deploy > "$RUNNER_TEMP/deploy.txt"
          printf '%s' "$GH_TOKEN" | npx -y wrangler@4.20.0 secret put GH_TOKEN
          printf '%s' "$APP_KEY" | npx -y wrangler@4.20.0 secret put APP_KEY
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1 > "$RUNNER_TEMP/url.txt"
          [ -s "$RUNNER_TEMP/url.txt" ]
      # Hard gate: the Worker is up, accepts the app key and can read the private repo with the new token.
      - name: Smoke test (health, app key, /data)
        env:
          KEY: ${{ secrets.NARRATIV_APP_KEY }}
        run: |
          URL=$(cat "$RUNNER_TEMP/url.txt")
          sleep 5
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 30 "$URL/health"
          curl -sS --fail --retry 3 --retry-delay 5 --max-time 30 "$URL/data/data/picks.json" -H "X-App-Key: $KEY" -o /dev/null
      # Visible on purpose: prints only which Home-strip sources answered (no values, no key). Not a gate.
      - name: Ticker sources (/ticker)
        shell: bash
        continue-on-error: true
        env:
          KEY: ${{ secrets.NARRATIV_APP_KEY }}
        run: |
          URL=$(cat "$RUNNER_TEMP/url.txt")
          curl -sS --max-time 30 "$URL/ticker" -H "X-App-Key: $KEY" | python3 -c "import sys,json; print('ticker sources:', [i['k'] for i in json.load(sys.stdin).get('items',[])])"
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          h="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')"
          for i in 1 2 3; do git -c http.https://github.com/.extraheader="$h" pull -q --rebase origin main && git -c http.https://github.com/.extraheader="$h" push -q origin HEAD:main && break; sleep 5; done
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
