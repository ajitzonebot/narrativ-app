# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: cf-setup

# One-off, idempotent: create the D1 database "narrativ" and the R2 bucket "narrativ-data" (Standard class) if missing.
on: workflow_dispatch

# No repo token needed: only the Cloudflare / Worker secrets are used.
permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - name: Create D1 database and R2 bucket
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACC=$(printf %s "$ACC" | tr -d "[:space:]\"'")
          API="https://api.cloudflare.com/client/v4/accounts/$ACC"
          H=(-H "Authorization: Bearer $CF" -H "Content-Type: application/json")
          if curl -s "${H[@]}" "$API/d1/database?name=narrativ" | jq -e '.result | map(select(.name=="narrativ")) | length > 0' >/dev/null; then
            echo "D1 narrativ: already exists"
          else
            curl -s -X POST "${H[@]}" "$API/d1/database" -d '{"name":"narrativ"}' | jq -c '{success, errors, name: .result.name, created: .result.created_at}'
          fi
          curl -s "${H[@]}" "$API/d1/database?name=narrativ" | jq -c '[.result[] | {name, uuid_set: (.uuid != null), num_tables, file_size}]'
          if curl -s "${H[@]}" "$API/r2/buckets" | jq -e '.result.buckets | map(select(.name=="narrativ-data")) | length > 0' >/dev/null; then
            echo "R2 narrativ-data: already exists"
          else
            curl -s -X POST "${H[@]}" "$API/r2/buckets" -d '{"name":"narrativ-data","storageClass":"Standard"}' | jq -c '{success, errors, name: .result.name, class: .result.storage_class}'
          fi
          curl -s "${H[@]}" "$API/r2/buckets" | jq -c '[.result.buckets[] | {name, storage_class, creation_date}]'
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && break; sleep 5; done
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
