# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: reader

# Reading pipeline stages 1 and 2 (narrativ/reader.py): free Gemini Flash-Lite reads every scored stock's latest transcript and
# presentation; Gemini Flash reads the stocks Claude reviews next. Code verifies every quote; research packs get the rows for
# Claude (stage 3). Runs after the daily run (one run per free-quota day: limits reset ~13:30 IST) and on weekends to work the
# backlog until the whole universe is read.
# Packs (docs/data/packs) race: the reader's saves reset to main and re-patch its rows, so they never conflict; a daily push
# that meets a reader save keeps its own packs (scripts/push_retry.sh, PUSH_MINE) and the reader's next save re-patches.
on:
  workflow_run:
    workflows: ["daily-funnel"]
    types: [completed]
  schedule:
    - cron: "15 9 * * 0,6"   # 14:45 IST Sat/Sun: backlog
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # gate: read the daily run's steps

concurrency:
  group: reader
  cancel-in-progress: false

jobs:
  # A daily run that skipped (no new prices) still ends "success". Go on only if its "Run funnel" step ran
  # (public run list, read with the public job's own token; unknown = go on).
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          c=""
          [ -n "$RUN_ID" ] && c=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '[.jobs[].steps[]? | select(.name == "Run funnel") | .conclusion] | first // ""' 2>/dev/null || true)
          echo "daily run ${RUN_ID:-none}: Run funnel ${c:-n/a}"
          if [ "$c" = "skipped" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && break; sleep 5; done
          exit 0

  read:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_RW_TOKEN }}
          ref: main
          persist-credentials: true   # narrativ.reader saves to main itself (git push inside the run)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The daily run's sources cache, read-only (only daily.yml saves it) ...
      - uses: actions/cache/restore@v4
        with:
          path: data/source_cache
          key: sources-daily-${{ github.run_id }}
          restore-keys: |
            sources-daily-
            sources-
      # ... plus the reader's own document texts on top (its own prefix; saved at the end of the job).
      - uses: actions/cache@v4
        with:
          path: data/source_cache/doctext
          key: reader-doctext-${{ github.run_id }}
          restore-keys: reader-doctext-
      - name: Read (Flash-Lite and Flash in parallel)
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READER_SAVE: "1"   # saves to main every 20 minutes and at the end (narrativ.reader.save: conflict-free)
          # after each save's push, changed docs/data files (patched packs) go to R2 (narrativ/appsync.py)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m narrativ.reader --daily
      - name: Save after a failure
        # the run stopped early (crash, timeout): save what it read; a normal run has already saved
        if: failure() || cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m narrativ.reader --save
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && break; sleep 5; done
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
