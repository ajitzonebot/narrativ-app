# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: filings-burst

# One-off parallel backfill: N runners each take every N-th symbol. Each uploads only the files it changed;
# one merge job commits them all (no push races). The shard artifacts hold only data/financials files, which the mirror
# publishes anyway (paths.txt), so public artifacts expose nothing private. Use when many companies are due (new universe, first build).
on:
  workflow_dispatch:
    inputs:
      per_shard: { description: "Max companies per shard", default: "400" }
      mode: { description: "backfill (new filings), leases (re-read lease liabilities) or history (short-history companies: basis for 3-year data), banks (standalone NPA / CET1 re-read)", default: "backfill" }

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { i: [0, 1, 2, 3, 4] }
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_RW_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Backfill shard
        env:
          PYTHONUNBUFFERED: "1"
          FILINGS_SHARD: "${{ matrix.i }}/5"
          FILINGS_MAX_MINUTES: "50"
        run: |
          if [ "${{ inputs.mode }}" = "leases" ]; then python -m narrativ.filings --leases; elif [ "${{ inputs.mode }}" = "history" ]; then python -m narrativ.filings --history; elif [ "${{ inputs.mode }}" = "audit" ]; then python -m narrativ.filings --audit; elif [ "${{ inputs.mode }}" = "banks" ]; then python -m narrativ.filings --banks; else python -m narrativ.filings --backfill "${{ inputs.per_shard }}"; fi
      - name: Pack changed files
        run: |
          git status --porcelain -uall data/financials | awk '{print $2}' > changed.txt
          wc -l < changed.txt
          tar czf shard.tgz -T changed.txt
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.i }}", path: shard.tgz, retention-days: 3 }
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          ok=0
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && { ok=1; break; }; sleep 5; done
          # a branch build (android-test with ref) cannot rebase its own commits onto main: put the log alone on top of main
          if [ "$ok" = 0 ]; then
            git rebase --abort 2>/dev/null; f=$(git show --name-only --format= HEAD -- logs | head -1)
            for i in 1 2 3; do
              git "${auth[@]}" fetch -q origin main && git checkout -q -f FETCH_HEAD && mkdir -p logs && cp "$RUNNER_TEMP/narrativ.log" "${f:-logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log}" &&
                git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs && git "${auth[@]}" push -q origin HEAD:main && break
              sleep 5
            done
          fi
          exit 0

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_RW_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: { pattern: "shard-*", path: shards }
      - name: Commit
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          for f in shards/*/shard.tgz; do tar xzf "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/financials
          git diff --cached --quiet && exit 0
          git commit -m "data: filings burst $(date -u +%FT%H%M) ($(git diff --cached --name-only | wc -l) files)"
          bash scripts/push_retry.sh
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          ok=0
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && { ok=1; break; }; sleep 5; done
          # a branch build (android-test with ref) cannot rebase its own commits onto main: put the log alone on top of main
          if [ "$ok" = 0 ]; then
            git rebase --abort 2>/dev/null; f=$(git show --name-only --format= HEAD -- logs | head -1)
            for i in 1 2 3; do
              git "${auth[@]}" fetch -q origin main && git checkout -q -f FETCH_HEAD && mkdir -p logs && cp "$RUNNER_TEMP/narrativ.log" "${f:-logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log}" &&
                git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs && git "${auth[@]}" push -q origin HEAD:main && break
              sleep 5
            done
          fi
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
