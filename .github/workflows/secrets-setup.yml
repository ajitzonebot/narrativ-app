name: secrets-setup

# One-time: stores the private repo's secrets here. The private repo seals each value with this
# repo's public key (only GitHub can open it); this job only passes the sealed values on.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'key = print this repo''s public key; store = store sealed values from a private run'
        required: true
        default: key
      run_id:
        description: 'Private repo run id with the sealed values (for store)'
        required: false

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Public key
        if: inputs.step == 'key'
        env:
          GH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::NARRATIV_RW_TOKEN is not set"; exit 1; fi
          gh api repos/${{ github.repository }}/actions/secrets/public-key --jq '"KEY_ID=\(.key_id) KEY=\(.key)"'

      - name: Store
        if: inputs.step == 'store'
        env:
          GH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
          RUN: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN" -R ajitzonebot/Narrativ -n sealed -D sealed
          KID=$(jq -r .key_id sealed/sealed.json)
          for n in $(jq -r '.values | keys[]' sealed/sealed.json); do
            v=$(jq -r --arg n "$n" '.values[$n]' sealed/sealed.json)
            gh api -X PUT "repos/${{ github.repository }}/actions/secrets/$n" -f encrypted_value="$v" -f key_id="$KID" --silent
            echo "stored $n"
          done
          rm -rf sealed
