# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: android-screenshots

# UI check: installs the latest APK on an emulator and screenshots every screen (android/ci/shots.sh).
# The screens show private data (picks, theses), and artifacts and logs in the public repo are public. So:
# - no upload-artifact: the screenshots are pushed to the PRIVATE repo, branch ci-shots (one commit, replaced each run);
# - the script's output (it runs with set -x) goes to the run's private log file, not the public log.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private branch to build from (with build = true)"
        type: string
        default: main
      build:
        description: "Build a debug APK from that branch instead of downloading the latest release"
        type: boolean
        default: false
      looks:
        description: "Looks to shoot, e.g. 'paper classic' (empty = as the app opens)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_RW_TOKEN }}
          persist-credentials: false
          ref: ${{ inputs.build && inputs.ref || '' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        if: inputs.build
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.build
        with:
          gradle-version: "8.11.1"
      - name: Build a debug APK from the branch (nothing published)
        if: inputs.build
        working-directory: android
        env:
          KEY: ${{ secrets.NARRATIV_APP_KEY }}
        run: |
          # the real app key, so the screens load data; this APK is only installed on the runner's emulator
          [ -n "$KEY" ] && echo "::add-mask::$KEY"
          gradle assembleDebug ${KEY:+-PciAppKey="$KEY"}
          cp app/build/outputs/apk/debug/app-debug.apk ../app.apk
      - name: Download latest APK
        if: ${{ !inputs.build }}
        env:
          GH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          REPO=$(python3 -c "import json;u=json.load(open('docs/app/version.json'))['apkUrl'];print('/'.join(u.split('/')[3:5]))")
          gh release download --repo "$REPO" --pattern "*.apk" --output app.apk
          ls -la app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: LOOKS="${{ inputs.looks }}" bash android/ci/shots.sh >> "$RUNNER_TEMP/narrativ.log" 2>&1
      - name: Save the screenshots in the private repo (branch ci-shots)
        if: always()
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          [ -d shots ] || { echo "no screenshots"; exit 0; }
          d=$(mktemp -d)
          cp -r shots "$d/"
          cd "$d"
          git init -q -b ci-shots
          git add shots
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "ci: app screenshots $(TZ=Asia/Kolkata date '+%F %H:%M') IST (run $GITHUB_RUN_ID)"
          h="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="$h" push -q -f "https://github.com/ajitzonebot/Narrativ.git" HEAD:refs/heads/ci-shots
          echo "screenshots: $(ls shots | wc -l) files on branch ci-shots"
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          ok=0
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && { ok=1; break; }; sleep 5; done
          # a branch build (android-test with ref) cannot rebase its own commits onto main: put the log alone on top of main
          if [ "$ok" = 0 ]; then
            git rebase --abort 2>/dev/null; f=$(git show --name-only --format= HEAD -- logs | head -1)
            for i in 1 2 3; do
              git "${auth[@]}" fetch -q origin main && git checkout -q -f FETCH_HEAD && mkdir -p logs && cp "$RUNNER_TEMP/narrativ.log" "${f:-logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log}" &&
                git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs && git "${auth[@]}" push -q origin HEAD:main && break
              sleep 5
            done
          fi
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
