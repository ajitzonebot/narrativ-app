# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: gh-token-check

# Read-only check of the Worker's GitHub token (secret NARRATIV_WORKER_TOKEN; worker.yml gives it to the Worker as GH_TOKEN).
# It needs exactly what worker/worker.js calls: read docs/ of the private repo (/data), list and create issues there
# (feedback, scan), start workflows in this public repo (cron dispatch of daily.yml / ipo.yml). It must NOT be able to push.
# Starts the read-only d1-check here as the dispatch test. Prints only HTTP codes and true/false.
on: workflow_dispatch

# No repo token needed: only the Worker token is used.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - name: Worker token permissions
        shell: bash   # visible: prints HTTP codes only
        env:
          T: ${{ secrets.NARRATIV_WORKER_TOKEN }}
          DATA_REPO: ajitzonebot/Narrativ
        run: |
          [ -n "$T" ] || { echo "NARRATIV_WORKER_TOKEN is not set"; exit 1; }
          H=(-H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json")
          code() { curl -s -o /dev/null -w "%{http_code}" "${H[@]}" "$@"; }
          read_data=$(code "https://api.github.com/repos/$DATA_REPO/contents/docs/data/picks.json")
          list_issues=$(code "https://api.github.com/repos/$DATA_REPO/issues?per_page=1")
          dispatch=$(code -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/d1-check.yml/dispatches" -d '{"ref":"main"}')
          # write probe that cannot succeed (no such commit): 403 = no Contents write (good), 422 = the token could push
          push=$(code -X POST "https://api.github.com/repos/$DATA_REPO/git/refs" -d '{"ref":"refs/heads/token-check","sha":"0000000000000000000000000000000000000000"}')
          echo "read private docs/: http=$read_data (want 200)"
          echo "list private issues: http=$list_issues (want 200; creating needs Issues: Read and write)"
          echo "dispatch d1-check here: http=$dispatch (want 204; 403 = add Actions: Read and write)"
          echo "write probe on the private repo: http=$push (want 403)"
          [ "$read_data" = 200 ] && [ "$list_issues" = 200 ] && [ "$dispatch" = 204 ] && [ "$push" = 403 ]
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          ok=0
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && { ok=1; break; }; sleep 5; done
          # a branch build (android-test with ref) cannot rebase its own commits onto main: put the log alone on top of main
          if [ "$ok" = 0 ]; then
            git rebase --abort 2>/dev/null; f=$(git show --name-only --format= HEAD -- logs | head -1)
            for i in 1 2 3; do
              git "${auth[@]}" fetch -q origin main && git checkout -q -f FETCH_HEAD && mkdir -p logs && cp "$RUNNER_TEMP/narrativ.log" "${f:-logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log}" &&
                git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs && git "${auth[@]}" push -q origin HEAD:main && break
              sleep 5
            done
          fi
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ
  DATA_STAGE: ${{ vars.DATA_STAGE || '0' }}   # narrativ/databranch.py: 0 main only, 1-2 + data branch, 3+ data branch
  APP_REF: ${{ vars.APP_REF || 'main' }}      # the branch the app reads (appsync and the Worker follow it)

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
