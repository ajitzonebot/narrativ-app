# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: daily-funnel

on:
  schedule:
    - cron: "40 11 * * 1-5"   # 17:10 IST; the Worker cron also starts it at 17:10 IST, and this run then skips if no newer prices exist than the data already built
    # retries (owner, 25 Nov 2026): NSE's closing-price file is often not out at 17:10 (23 and 25 Nov 2026 built the previous
    # trading day), so try again at 20:10 and 22:10 IST; each retry skips in about a minute when the day is already built
    - cron: "40 14 * * 1-5"
    - cron: "40 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read   # the public job's own token reads the public repo's run list (wait for republish)

# Only daily and filings share this group. Publish research (republish.yml) has its own group, so a queued republish can
# never replace (cancel) a pending daily run; instead republish skips while a daily run is in progress, and this run
# waits for a running republish before it checks out.
concurrency:
  group: funnel
  cancel-in-progress: false

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - name: Wait for a running research publish to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/republish.yml/runs" -f status=in_progress --jq .total_count 2>/dev/null || echo 0)
            [ "${n:-0}" = "0" ] && exit 0
            echo "republish running; waiting ($i)"
            sleep 30
          done
          echo "republish still running after 20 minutes; going on"
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_RW_TOKEN }}
          persist-credentials: false
      - name: Data files from the data branch (stage 3+; does nothing before)
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: python3 -m narrativ.databranch checkout --force
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Skip if there are no new prices since the last build (backup schedule only)
        id: skip
        # picks.json "date" is the last PRICE (trading) date, not the IST calendar day. GitHub's backup schedule can start after
        # midnight IST, so comparing with the IST date never matched and a full rerun stamped the previous prices with the next
        # day. Compare with the newest published NSE end-of-day file instead. If that cannot be determined, run (fail open).
        # reader.yml and docling.yml check whether "Run funnel" ran (a skipped run still ends "success"): keep that step name.
        run: |
          latest=$(python3 -m scripts.latest_trading_date 2>/dev/null || true)
          have=$(python3 -c "import json;print(json.load(open('docs/data/picks.json')).get('date',''))" 2>/dev/null || true)
          echo "latest exchange date=${latest:-unknown} data date=${have:-none}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$latest" ] && [ "$have" = "$latest" ]; then echo "already built for $latest"; echo "skip=true" >> $GITHUB_OUTPUT; fi
      # Tests gate publishing: the public copies have no push trigger, so this is where code changes get tested (~15 s).
      - name: Tests (ruff, pytest)
        if: steps.skip.outputs.skip != 'true'
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          python -m pytest -q -p no:cacheprovider
      # This workflow owns the sources cache (prefix sources-daily-). Every other job restores it read-only.
      # The second restore key finds the caches saved before the per-workflow prefixes (first run after the change only).
      - uses: actions/cache@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          path: data/source_cache
          key: sources-daily-${{ github.run_id }}
          restore-keys: |
            sources-daily-
            sources-
      - uses: actions/cache/restore@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          path: data/news_cache
          key: news-${{ github.run_id }}
          restore-keys: news-
      - name: Run funnel
        if: steps.skip.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
          DEFER_D1: "1"   # D1 is written after the publish (step "Database sync"), so a build the gate refuses never reaches D1
        run: python run.py
      - name: Commit results
        if: steps.skip.outputs.skip != 'true'
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
          # after the push, scripts/push_retry.sh uploads changed docs/data files to R2 (narrativ/appsync.py; the Worker reads R2 first)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --archive: one dated archive of the published docs/data and data to R2 (narrativ/archive.py, kept 30 days)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # scripts/publish.sh: the gate refuses a broken build (no picks, files missing, JSON that does not parse): nothing is
          # committed, the last data stays live. DATA_STAGE picks main or the data branch (narrativ/databranch.py)
          bash scripts/publish.sh -m "data: daily funnel $(date -u +%F)" --gate --archive -- docs/data data RULES.md
      # only after the publish succeeded (a refused build stops the job above): D1 gets exactly what was published
      - name: Database sync (after the publish)
        if: steps.skip.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
          APP_R2: "0"   # the manifest is not an app file
        run: |
          python -m narrativ.dbsync --deferred
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish.sh -m "data: D1 manifest $(date -u +%F)" -- data/d1_manifest.json
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          ok=0
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && { ok=1; break; }; sleep 5; done
          # a branch build (android-test with ref) cannot rebase its own commits onto main: put the log alone on top of main
          if [ "$ok" = 0 ]; then
            git rebase --abort 2>/dev/null; f=$(git show --name-only --format= HEAD -- logs | head -1)
            for i in 1 2 3; do
              git "${auth[@]}" fetch -q origin main && git checkout -q -f FETCH_HEAD && mkdir -p logs && cp "$RUNNER_TEMP/narrativ.log" "${f:-logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log}" &&
                git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs && git "${auth[@]}" push -q origin HEAD:main && break
              sleep 5
            done
          fi
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ
  DATA_STAGE: ${{ vars.DATA_STAGE || '0' }}   # narrativ/databranch.py: 0 main only, 1-2 + data branch, 3+ data branch
  APP_REF: ${{ vars.APP_REF || 'main' }}      # the branch the app reads (appsync and the Worker follow it)

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
