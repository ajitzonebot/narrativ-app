# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: Free reader test

# Gemini (free tier) reads the documents Claude cited for its full reviews; compares the reader's items with Claude's.
# Results: data/reader_test/<model>.json and .summary.json (committed). Resumes where it stopped (daily limits).
on:
  workflow_dispatch:
    inputs:
      model: { description: "Model name, e.g. gemini-3.5-flash-lite or gemini-3.8-flash", default: "gemini-3.5-flash-lite" }
      limit: { description: "Max documents this run (flash 20/day, flash-lite 500/day; langextract ~8 requests a document)", default: "60" }
      engine: { description: "reader (our single call) or langextract (trial)", default: "reader" }

permissions:
  contents: write

concurrency:
  group: reader-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_RW_TOKEN }}
          persist-credentials: false
      - name: Data files from the data branch (stage 3+; does nothing before)
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: python3 -m narrativ.databranch checkout --force
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4   # read-only: daily.yml owns the sources cache
        with:
          path: data/source_cache
          key: sources-daily-${{ github.run_id }}
          restore-keys: |
            sources-daily-
            sources-
      - name: Read and compare
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENGINE: ${{ inputs.engine }}
          MODEL: ${{ inputs.model }}
          LIMIT: ${{ inputs.limit }}
        run: |
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a number"; exit 1 ;; esac
          case "$MODEL" in *[!a-zA-Z0-9._-]*) echo "bad model name"; exit 1 ;; esac
          if [ "$ENGINE" = "langextract" ]; then
            pip install "langextract>=1.0"
            python -m narrativ.lxtrial "$LIMIT"
          else
            python -m narrativ.reader --test "$MODEL" "$LIMIT"
          fi
      - name: Commit results
        if: always()
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish.sh -m "data: free reader test $MODEL" -- data/reader_test
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          ok=0
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && { ok=1; break; }; sleep 5; done
          # a branch build (android-test with ref) cannot rebase its own commits onto main: put the log alone on top of main
          if [ "$ok" = 0 ]; then
            git rebase --abort 2>/dev/null; f=$(git show --name-only --format= HEAD -- logs | head -1)
            for i in 1 2 3; do
              git "${auth[@]}" fetch -q origin main && git checkout -q -f FETCH_HEAD && mkdir -p logs && cp "$RUNNER_TEMP/narrativ.log" "${f:-logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log}" &&
                git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs && git "${auth[@]}" push -q origin HEAD:main && break
              sleep 5
            done
          fi
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ
  DATA_STAGE: ${{ vars.DATA_STAGE || '0' }}   # narrativ/databranch.py: 0 main only, 1-2 + data branch, 3+ data branch
  APP_REF: ${{ vars.APP_REF || 'main' }}      # the branch the app reads (appsync and the Worker follow it)

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
