# Generated from the private repo by .github/mirror/public_workflows.py: edit it there.
name: ipo
# Open-IPO check without Claude (narrativ/ipo.py): 08:30 and 15:30 IST Mon-Fri, started by the Cloudflare Worker crons
# (exact time); the GitHub schedule below is a late backup. The 15:30 run makes the final-day call.
# The backup skips when another ipo run started in the last 150 minutes and succeeded or is still running (the Worker's
# run did this slot), so it only runs when the Worker's dispatch failed. 150 minutes covers GitHub's usual cron delay and
# stays well inside the 7 hours between the two slots.
on:
  schedule:
    - cron: "15 3 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # the public job's own token reads this workflow's recent runs
concurrency:
  group: ipo
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Quiet logs (public repo)
        shell: bash
        run: |
          cat > /home/runner/q.sh <<'EOF'
          bash --noprofile --norc -eo pipefail "$1" >> "$RUNNER_TEMP/narrativ.log" 2>&1 && exit 0
          echo "Step failed. The full log is saved in the private repo (logs/)."
          exit 1
          EOF
      - name: Skip the backup schedule if the Worker's run did this slot
        id: skip
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-150 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ipo.yml/runs" -f created=">=$since" -f per_page=20 \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .status != \"completed\")] | length" 2>/dev/null || echo 0)
          echo "ipo runs since $since (done or running): ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: ajitzonebot/Narrativ
          token: ${{ secrets.NARRATIV_RW_TOKEN }}
          persist-credentials: false
        if: steps.skip.outputs.skip != 'true'
      - name: Data files from the data branch (stage 3+; does nothing before)
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: python3 -m narrativ.databranch checkout --force
      - uses: actions/setup-python@v5
        if: steps.skip.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: IPO check
        if: steps.skip.outputs.skip != 'true'
        run: |
          pip install -q -r requirements.txt
          python -m narrativ.ipo
      - name: Commit
        if: steps.skip.outputs.skip != 'true'
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # push_retry.sh: changed docs/data files to R2 after the push
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish.sh -m "ipo: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') check" --mine all -- docs/data/ipo_today.json docs/data/ipo_history.json
      - name: Save the log in the private repo
        if: failure()
        shell: bash
        env:
          GIT_PUSH_TOKEN: ${{ secrets.NARRATIV_RW_TOKEN }}
        run: |
          set +e
          [ -d .git ] && [ -f "$RUNNER_TEMP/narrativ.log" ] || exit 0
          mkdir -p logs
          cp "$RUNNER_TEMP/narrativ.log" "logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs
          git stash -u -q
          auth=()
          [ -z "$(git config --get-all http.https://github.com/.extraheader)" ] && auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_PUSH_TOKEN" | base64 | tr -d '\n')")
          ok=0
          for i in 1 2 3; do git "${auth[@]}" pull -q --rebase origin main && git "${auth[@]}" push -q origin HEAD:main && { ok=1; break; }; sleep 5; done
          # a branch build (android-test with ref) cannot rebase its own commits onto main: put the log alone on top of main
          if [ "$ok" = 0 ]; then
            git rebase --abort 2>/dev/null; f=$(git show --name-only --format= HEAD -- logs | head -1)
            for i in 1 2 3; do
              git "${auth[@]}" fetch -q origin main && git checkout -q -f FETCH_HEAD && mkdir -p logs && cp "$RUNNER_TEMP/narrativ.log" "${f:-logs/$GITHUB_WORKFLOW-$(date -u +%Y%m%d-%H%M).log}" &&
                git add logs && git commit -qm "logs: $GITHUB_WORKFLOW failed" -- logs && git "${auth[@]}" push -q origin HEAD:main && break
              sleep 5
            done
          fi
          exit 0

env:
  NARRATIV_REPO: ajitzonebot/Narrativ
  DATA_STAGE: ${{ vars.DATA_STAGE || '0' }}   # narrativ/databranch.py: 0 main only, 1-2 + data branch, 3+ data branch
  APP_REF: ${{ vars.APP_REF || 'main' }}      # the branch the app reads (appsync and the Worker follow it)

defaults:
  run:
    shell: bash /home/runner/q.sh {0}
