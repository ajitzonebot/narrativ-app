name = "narrativ"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# /data reads docs/data from R2 first (key app/<path>, uploaded after each push by narrativ/appsync.py), GitHub otherwise.
# Deploying a binding needs the Cloudflare API token to hold Account > Workers R2 Storage > Edit (the pipeline's R2 writes
# already need it). Without the binding the Worker reads GitHub only, as before.
[[r2_buckets]]
binding = "DATA_R2"
bucket_name = "narrativ-data"

[vars]
REPO = "ajitzonebot/Narrativ"
# The scheduled runs start in the public repo (free Actions minutes); they read and write REPO.
RUN_REPO = "ajitzonebot/narrativ-app"
# Branch of the generated app data when R2's manifest names none (data-branch plan): "main" until the data branch is live;
# appsync writes the manifest's "ref" and the Worker follows it.
DATA_REF = "main"

# One trigger every 10 minutes: worker.js SCHEDULE starts each job in its slot (daily run, retries, publish, filings, news,
# reader, history backfill, story, factors, replay, mirror, IPO) and runs the daily watchdog. The free plan allows 5 cron
# triggers per account; this uses 1 (owner, 27 Nov 2026).
[triggers]
crons = ["*/10 * * * *"]
