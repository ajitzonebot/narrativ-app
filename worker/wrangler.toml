name = "narrativ"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# /data reads docs/data from R2 first (key app/<path>, uploaded after each push by narrativ/appsync.py), GitHub otherwise.
# Deploying a binding needs the Cloudflare API token to hold Account > Workers R2 Storage > Edit (the pipeline's R2 writes
# already need it). Without the binding the Worker reads GitHub only, as before.
[[r2_buckets]]
binding = "DATA_R2"
bucket_name = "narrativ-data"

[vars]
REPO = "ajitzonebot/Narrativ"
# The scheduled runs start in the public repo (free Actions minutes); they read and write REPO.
RUN_REPO = "ajitzonebot/narrativ-app"

# Weekdays. Cloudflare numbers day-of-week 1 = SUNDAY (not Monday), so "1-5" ran Sun-Thu and skipped Friday: use MON-FRI names.
# worker.js compares event.cron with the IPO strings below (IPO_CRONS); keep them identical.
# 11:40 UTC = 17:10 IST (after NSE close): starts daily.yml in ajitzonebot/narrativ-app.
# 03:00 UTC = 08:30 IST and 10:00 UTC = 15:30 IST: start ipo.yml in ajitzonebot/narrativ-app (code-only IPO check; 15:30 = final-day call).
[triggers]
crons = ["40 11 * * MON-FRI", "0 3 * * MON-FRI", "0 10 * * MON-FRI"]
